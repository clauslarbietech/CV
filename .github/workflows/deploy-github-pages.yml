name: Build web preview

on:
  push:
    branches:
      - cursor/childrens-dev-anime-app-9573
      - main
  pull_request:
  workflow_dispatch:

# GitHub Pages Actions deploys are only allowed from `main` in this repo.
# Feature-branch / PR CI validates the Expo web export only.
# Deploy to Pages happens on `main` (or manual dispatch) via the gh-pages branch.

permissions:
  contents: write

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export Expo web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_ESV_API_KEY: ${{ secrets.EXPO_PUBLIC_ESV_API_KEY }}
          EXPO_PUBLIC_YOUVERSION_APP_KEY: ${{ secrets.EXPO_PUBLIC_YOUVERSION_APP_KEY }}

      - name: Prepare Pages bundle
        run: bash scripts/prepare-pages-dist.sh

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  deploy-gh-pages:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: Deploy Anime Audio Bible web preview
